# Fixture for the Milestone 6 Hyprland `.conf` binding parser.
# Not loaded by a live compositor -- it exists only as parser input.
#
# Covers every declaration in SPEC.md 16.3 (bind, binde, bindl, bindm, bindr,
# bindd) and every `source` edge case in SPEC.md 16.5 / 31.2 (nested, relative,
# cyclic, unreadable).
#
# All resolvable sources are RELATIVE so the fixture is self-contained and does
# not depend on the machine's real ~/.config/hypr.

$mainMod = SUPER
$terminal = ghostty

# --- bind: plain -------------------------------------------------------------
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, Q, exit,
# Empty modifier field: key with no modifiers.
bind = , Print, exec, hyprshot -m output

# --- binde: repeats while held -----------------------------------------------
binde = $mainMod, minus, splitratio, -0.1
binde = $mainMod, equal, splitratio, 0.1

# --- bindl: fires even while the session is locked ---------------------------
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- bindm: mouse ------------------------------------------------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- bindr: fires on release -------------------------------------------------
bindr = $mainMod, SUPER_L, exec, pkill walker || walker

# --- bindd: description is the third field, before the dispatcher ------------
# SPEC.md 16.3: bindd descriptions win over anything the parser infers.
bindd = $mainMod, K, Show keybindings, exec, coo-keybindings
bindd = $mainMod SHIFT, S, Screenshot a region, exec, hyprshot -m region
# A description containing a comma -- the split must be field-count aware,
# not a naive split on every comma.
bindd = $mainMod, G, Toggle group, then cycle, togglegroup,

# --- source: nested (this file -> nested.conf -> sub/deeper.conf) ------------
source = nested.conf

# --- source: cyclic (cycle-a.conf <-> cycle-b.conf) --------------------------
# The parser must terminate and must not emit either binding twice.
source = cycle-a.conf

# --- source: unreadable, with a tilde to expand ------------------------------
# SPEC.md 16.5: expand `~`, then skip missing files with a diagnostic rather
# than aborting the parse. Bindings after this line must still be picked up.
source = ~/.config/hypr/this-file-does-not-exist.conf

bind = $mainMod, N, exec, coo-notify
