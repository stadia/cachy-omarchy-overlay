# Milestone 3 Hyprland bindings (conf).
# Loaded via a managed source block. The helper must not hyprctl reload.
#
# bindd = MOD, key, description, dispatcher, params. Hyprland 0.56.2 reports the
# description straight back through `hyprctl binds`, so the keybindings sheet
# shows it instead of the raw command and upstream prioritize_entries ranks the
# row by this exact English text. Keep it in step with bindings.lua.
unbind = SUPER, SPACE
bindd = SUPER, SPACE, Launch apps, exec, cachy-omarchy-launcher
unbind = SUPER, K
bindd = SUPER, K, Keybindings, exec, cachy-omarchy-keybindings

# Quattro shell autostart: 세션 시작 1회(exec-once). bindings.lua 의
# hyprland.start 와 같은 모델 — 리로드로는 재기동하지 않는다.
exec-once = cachy-omarchy-shell --run
