name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: docker.io/cachyos/cachyos:latest
      options: --user root
    steps:
      - name: 빌드 도구 설치
        run: |
          pacman -Syu --noconfirm --needed base-devel git python sudo

      # makepkg 는 root 로 돌지 않는다. 빌드 전용 사용자를 만든다.
      - name: 빌드 사용자 생성
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: 소유권 이전
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      # 패키지 빌드는 upstream.lock 이 고정한 정확한 Omarchy 소스를 사용한다.
      - name: Omarchy 소스 준비
        run: |
          sudo -u builder --preserve-env=GITHUB_WORKSPACE bash -lc '
            cd "$GITHUB_WORKSPACE"
            source upstream.lock
            git clone "$OMARCHY_REPOSITORY" build/omarchy
            git -C build/omarchy checkout --detach "$OMARCHY_COMMIT"
            test "$(git -C build/omarchy rev-parse HEAD)" = "$OMARCHY_COMMIT"
          '

      # bin/test-packages 는 bin/build-packages 가 남긴 validated-build
      # 매니페스트를 검증한다. 둘을 같은 사용자로 돌려야 상태 디렉터리가
      # 일치한다.
      - name: 빌드 + 테스트
        run: |
          sudo -u builder --preserve-env=GITHUB_WORKSPACE bash -lc '
            cd "$GITHUB_WORKSPACE"
            bin/build-packages
            bin/test-packages
          '

  resolve:
    runs-on: ubuntu-latest
    container:
      image: docker.io/cachyos/cachyos:latest
      options: --user root
    steps:
      - name: 빌드 도구 설치
        run: pacman -Syu --noconfirm --needed base-devel git pacman-contrib python sudo

      - name: 빌드 사용자 생성
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: 소유권 이전
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      # 패키지 빌드는 upstream.lock 이 고정한 정확한 Omarchy 소스를 사용한다.
      - name: Omarchy 소스 준비
        run: |
          sudo -u builder --preserve-env=GITHUB_WORKSPACE bash -lc '
            cd "$GITHUB_WORKSPACE"
            source upstream.lock
            git clone "$OMARCHY_REPOSITORY" build/omarchy
            git -C build/omarchy checkout --detach "$OMARCHY_COMMIT"
            test "$(git -C build/omarchy rev-parse HEAD)" = "$OMARCHY_COMMIT"
          '

      - name: 패키지 빌드
        run: |
          sudo -u builder --preserve-env=GITHUB_WORKSPACE bash -lc '
            cd "$GITHUB_WORKSPACE" && bin/build-packages
          '

      # 설치는 root 로. 스크립트가 게이트 A·B 를 스스로 검사한다.
      - name: 의존 해석 설치
        run: bin/ci-resolve-install

      # 빈 HOME 에는 Hyprland 설정이 없어 bindings 가 의도적으로 실패한다.
      # 이 lane 의 성공 정의는 두 갈래다. (a) 정말 빈 HOME 에서 init 이
      # bindings 단계까지 도달해 명확한 설정-부재 오류로 끝나는가, (b) 최소
      # conf 스텁을 둔 HOME 에서 init 이 완주하는가. 그래서 "빈 HOME 에서
      # 사용자 설정을 만든다"는 거짓 주장을 하지 않는다.
      - name: 헤드리스 init — 빈 HOME 실패 경로
        run: |
          useradd -m emptyuser
          set +e
          sudo -u emptyuser bash -lc 'cachy-omarchy-init' 2>&1 | tee /tmp/init-empty.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -ne 0
          grep -F 'Hyprland 설정을 찾을 수 없다' /tmp/init-empty.log

      - name: 헤드리스 init — 최소 conf 구성 완주
        run: |
          useradd -m enduser
          install -d -o enduser -g enduser /home/enduser/.config/hypr
          printf 'monitor=,preferred,auto,1\n' > /home/enduser/.config/hypr/hyprland.conf
          chown enduser:enduser /home/enduser/.config/hypr/hyprland.conf
          sudo -u enduser bash -lc 'cachy-omarchy-init' 2>&1 | tee /tmp/init.log

      # doctor 는 게이트가 아니다. 헤드리스 컨테이너에서는 WARN 이 정상이라
      # 게이트로 두면 무의미한 빨강이 된다. 크래시하지 않는 것만 본다.
      - name: 헤드리스 doctor (비게이트)
        run: |
          sudo -u enduser bash -lc 'cachy-omarchy-doctor' 2>&1 | tee /tmp/doctor.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-init
          path: |
            /tmp/init-empty.log
            /tmp/init.log
            /tmp/doctor.log
