name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: docker.io/cachyos/cachyos:latest
      options: --user root
    steps:
      - name: 빌드 도구 설치
        run: |
          pacman -Syu --noconfirm --needed base-devel git python sudo

      # makepkg 는 root 로 돌지 않는다. 빌드 전용 사용자를 만든다.
      - name: 빌드 사용자 생성
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: 소유권 이전
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      # 패키지 빌드는 upstream.lock 이 고정한 정확한 Omarchy 소스를 사용한다.
      - name: Omarchy 소스 준비
        run: |
          sudo -u builder --preserve-env=GITHUB_WORKSPACE bash -lc '
            cd "$GITHUB_WORKSPACE"
            source upstream.lock
            git clone "$OMARCHY_REPOSITORY" build/omarchy
            git -C build/omarchy checkout --detach "$OMARCHY_COMMIT"
            test "$(git -C build/omarchy rev-parse HEAD)" = "$OMARCHY_COMMIT"
          '

      # bin/test-packages 는 bin/build-packages 가 남긴 validated-build
      # 매니페스트를 검증한다. 둘을 같은 사용자로 돌려야 상태 디렉터리가
      # 일치한다.
      - name: 빌드 + 테스트
        run: |
          sudo -u builder --preserve-env=GITHUB_WORKSPACE bash -lc '
            cd "$GITHUB_WORKSPACE"
            bin/build-packages
            bin/test-packages
          '

  resolve:
    runs-on: ubuntu-latest
    container:
      image: docker.io/cachyos/cachyos:latest
      options: --user root
    steps:
      - name: 빌드 도구 설치
        run: pacman -Syu --noconfirm --needed base-devel git pacman-contrib python sudo

      - name: 빌드 사용자 생성
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: 소유권 이전
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      # 패키지 빌드는 upstream.lock 이 고정한 정확한 Omarchy 소스를 사용한다.
      - name: Omarchy 소스 준비
        run: |
          sudo -u builder --preserve-env=GITHUB_WORKSPACE bash -lc '
            cd "$GITHUB_WORKSPACE"
            source upstream.lock
            git clone "$OMARCHY_REPOSITORY" build/omarchy
            git -C build/omarchy checkout --detach "$OMARCHY_COMMIT"
            test "$(git -C build/omarchy rev-parse HEAD)" = "$OMARCHY_COMMIT"
          '

      - name: 패키지 빌드
        run: |
          sudo -u builder --preserve-env=GITHUB_WORKSPACE bash -lc '
            cd "$GITHUB_WORKSPACE" && bin/build-packages
          '

      # 설치는 root 로. 스크립트가 게이트 A·B 를 스스로 검사한다.
      - name: 의존 해석 설치
        run: bin/ci-resolve-install

      # 빈 HOME 에는 Hyprland 설정이 없어 bindings 가 의도적으로 실패한다.
      # 세 로그를 먼저 모두 수집한 뒤, 두 init 결과만 마지막에 판정한다.
      # doctor 는 헤드리스 WARN 을 허용하는 비게이트 증거다.
      - name: 헤드리스 init / doctor 증거 수집
        run: |
          : > /tmp/init-empty.log
          : > /tmp/init.log
          : > /tmp/doctor.log
          set +e

          useradd -m emptyuser
          sudo -u emptyuser bash -lc 'cachy-omarchy-init' 2>&1 | tee /tmp/init-empty.log
          empty_init_status=${PIPESTATUS[0]}

          useradd -m enduser
          sudo -u enduser bash -lc '
            install -d "$HOME/.config/hypr"
            printf "monitor=,preferred,auto,1\\n" > "$HOME/.config/hypr/hyprland.conf"
          '
          conf_setup_status=$?
          sudo -u enduser bash -lc 'cachy-omarchy-init' 2>&1 | tee /tmp/init.log
          init_status=${PIPESTATUS[0]}

          sudo -u enduser bash -lc 'cachy-omarchy-doctor' 2>&1 | tee /tmp/doctor.log
          doctor_status=${PIPESTATUS[0]}
          set -e

          failed=0
          if test "$empty_init_status" -eq 0; then
            echo '빈 HOME init 이 성공했다' >&2
            failed=1
          fi
          if ! grep -F 'Hyprland 설정을 찾을 수 없다' /tmp/init-empty.log; then
            echo '빈 HOME init 에 bindings 설정-부재 오류가 없다' >&2
            failed=1
          fi
          if test "$conf_setup_status" -ne 0; then
            echo '최소 Hyprland conf 구성에 실패했다' >&2
            failed=1
          fi
          if test "$init_status" -ne 0; then
            echo '최소 conf init 이 실패했다' >&2
            failed=1
          fi
          # doctor_status 는 의도적으로 판정하지 않는다.
          exit "$failed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-init
          path: |
            /tmp/init-empty.log
            /tmp/init.log
            /tmp/doctor.log
